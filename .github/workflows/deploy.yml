name: Deploy
on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
  deployments: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.DEPLOYMENT_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jp.bent.build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Require all checks for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/require-checks.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          PUBLIC_FEEDBACK_SERVER: ${{ vars.PUBLIC_FEEDBACK_SERVER }}
          PUBLIC_FEEDBACK_PROJECT_ID: ${{ vars.PUBLIC_FEEDBACK_PROJECT_ID }}
      - name: Require icon generation secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node -e 'if (!process.env.OPENAI_API_KEY?.trim()) throw new Error("OPENAI_API_KEY GitHub Actions secret is required")'
      - name: Apply category icon migration for verified commit
        run: pnpm exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy verified build with runtime secret
        run: node scripts/deploy-verified.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMDASH_ENCRYPTION_KEY: ${{ secrets.EMDASH_ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
