name: Quality
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * 1'
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, test, knip, build, test:integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.check }}
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.0
      - run: npm install --global pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          output: ${{ runner.temp }}/codeql-results
      - name: Require clean CodeQL results
        env:
          SARIF_DIRECTORY: ${{ runner.temp }}/codeql-results
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          from pathlib import Path

          reports = list(Path(os.environ['SARIF_DIRECTORY']).glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL did not produce a SARIF report')
          findings = [result for report in reports
                      for run in json.loads(report.read_text())['runs']
                      for result in run.get('results', [])]
          for result in findings:
              print(f"{result['ruleId']}: {result['message']['text']}")
          if findings:
              raise SystemExit(f'CodeQL reported {len(findings)} findings')
          PYCODE
